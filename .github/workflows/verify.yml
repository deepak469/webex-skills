name: Verify skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      plugin: ${{ steps.detect.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          skills="$(node scripts/changed-skills.mjs "$BASE_SHA" "$GITHUB_SHA")"
          echo "Changed skills: $skills"
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            plugin_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -E '^(plugins/|\.agents/plugins/|\.claude-plugin/|\.cursor-plugin/|\.windsurf-plugin/|scripts/(validate-plugin|generate-catalog|build-plugins)\.mjs$|scripts/lib/plugins\.mjs$|catalog\.json$|PLUGINS\.md$|package\.json$)' || true)"
            if [[ -n "$plugin_files" ]]; then plugin=true; else plugin=false; fi
          else
            plugin=true
          fi
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"

  verify:
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    name: verify (${{ matrix.skill }})
    env:
      SKILL: ${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node scripts/validate-skill.mjs "$SKILL"
      - run: npm test --workspace "skills/$SKILL"
      - run: npm run pack:check --workspace "skills/$SKILL"

  verify-plugin:
    needs: detect
    if: needs.detect.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node scripts/validate-plugin.mjs
      - run: npm run plugin:build
      - run: node --test tests/plugins.test.mjs

  # Single stable check name for branch protection, regardless of which skills ran.
  verified:
    needs: [detect, verify, verify-plugin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DETECT: ${{ needs.detect.result }}
          VERIFY: ${{ needs.verify.result }}
          PLUGIN: ${{ needs.verify-plugin.result }}
        run: |
          echo "detect=$DETECT verify=$VERIFY plugin=$PLUGIN"
          [[ "$DETECT" == "success" && ( "$VERIFY" == "success" || "$VERIFY" == "skipped" ) && ( "$PLUGIN" == "success" || "$PLUGIN" == "skipped" ) ]]
