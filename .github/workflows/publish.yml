name: Package skill release

on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to package (version is read from skills/<skill>/package.json)
        required: true
        type: choice
        options:
          - webex-api-knowledge
      dry-run:
        description: Validate and pack without committing the package
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: package-skill-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SKILL: ${{ inputs.skill }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node scripts/validate-skill.mjs "$SKILL"
      - name: Check changelog (stable versions)
        run: node scripts/changelog.mjs check "$SKILL"
      - run: npm test --workspace "skills/$SKILL"
      - name: Build package
        id: pack
        run: |
          flags=()
          [[ "$DRY_RUN" == "true" ]] && flags+=(--dry-run)
          node scripts/package-skill.mjs "$SKILL" "${flags[@]}" | tee result.json
          echo "version=$(node -p "require('./result.json').version")" >> "$GITHUB_OUTPUT"
          echo "file=$(node -p "require('./result.json').file")" >> "$GITHUB_OUTPUT"
          echo "latest=$(node -p "require('./result.json').latest")" >> "$GITHUB_OUTPUT"
      - name: Commit package
        if: ${{ inputs.dry-run != true }}
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          FILE: ${{ steps.pack.outputs.file }}
          LATEST: ${{ steps.pack.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" "$LATEST"
          git commit -m "release($SKILL): $VERSION"
          # Stable tags mark the start of the next changelog range.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git tag -a "$SKILL@$VERSION" -m "$SKILL $VERSION"
          fi
          git push --follow-tags
      - name: Summarize
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          {
            echo "## Skill package"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Skill | \`${SKILL}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Package | \`${FILE}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
